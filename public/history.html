<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<script>
try {
  if (localStorage.getItem('themeSetting') === 'light') document.documentElement.classList.add('theme-light');
} catch (e) { /* 既定のブラックのまま */ }
</script>
<title>あいぼう手帳 履歴</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="stylesheet" href="history.css" />
<script src="notion-client.js"></script>
<script src="vendor/supabase.js"></script>
<script src="auth-client.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e11;
    --bg-blur: rgba(14, 14, 17, 0.78);
    --card: #17171b;
    --fill: rgba(255, 255, 255, 0.07);
    --text: #f2f2f7;
    --muted: #8e8e96;
    --accent: #3d8bff;
    --accent-2: color-mix(in srgb, var(--accent) 70%, #ffffff);
    --accent-text: #ffffff;
    /* 境界線・影・角丸はホーム画面（index.html）と同じ値にそろえている */
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.1);
    --ok: #34c759;
    --err: #ff453a;
    --shadow: 0 0 0 0 transparent;
    --edge: 0 0 0 0 transparent;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  /* ホワイトテーマ（トップ画面の設定 → テーマと連動） */
  :root.theme-light {
    --bg: #f2f2f7;
    --bg-blur: rgba(242, 242, 247, 0.8);
    --card: #ffffff;
    --fill: rgba(120, 120, 128, 0.12);
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #2f7cf6;
    --accent-2: color-mix(in srgb, var(--accent) 80%, #000000);
    --border: rgba(0, 0, 0, 0.06);
    --border-strong: rgba(0, 0, 0, 0.1);
    --err: #ff3b30;
    --shadow: 0 0 0 0 transparent;
    --edge: 0 0 0 0 transparent;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html {
    background: var(--bg);
  }
  body {
    margin: 0 auto;
    max-width: 480px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 0 16px calc(60px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }
  @media (min-width: 640px) {
    body { max-width: 600px; }
  }
  @media (min-width: 900px) {
    body { max-width: 760px; }
  }
  h1 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.3px;
    margin: 0;
  }
  .page-header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 -16px 16px;
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
    background: var(--bg-blur);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
  }
  .back-link {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 14px;
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    padding: 8px 13px;
    border-radius: 20px;
    background: var(--fill);
    border: 1px solid var(--border);
    transition: transform .1s var(--ease), background .15s ease;
  }
  .back-link:active { transform: scale(0.95); background: var(--border-strong); }
  .card {
    background: var(--card);
    border: none;
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="page-header">
    <h1><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>履歴</h1>
    <a href="index.html" class="back-link">‹ 記録に戻る</a>
  </div>

  <div class="month-nav">
    <button type="button" id="prevMonthBtn">‹</button>
    <span class="month-label" id="monthLabel">----年--月</span>
    <button type="button" id="nextMonthBtn">›</button>
  </div>

  <div class="card">
    <div class="record-section">
      <h2>睡眠時間</h2>
      <div id="sleepChart"><div class="loading">読み込み中…</div></div>
    </div>
    <div class="record-section">
      <h2>体調</h2>
      <div id="levelChart" class="level-dots"><div class="loading">読み込み中…</div></div>
    </div>
    <div class="record-section">
      <h2>毎日の記録</h2>
      <div id="dayList"><div class="loading">読み込み中…</div></div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="editModal">
    <div class="modal-panel">
      <h3 id="editModalTitle">編集</h3>

      <form id="editForm">
        <div id="field-time" hidden>
          <label>時刻</label>
          <div class="field-row">
            <input type="time" id="editTime" step="300" />
            <button type="button" class="now-btn" data-target="editTime"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></button>
          </div>
        </div>

        <div id="field-content" hidden>
          <label>内容</label>
          <textarea id="editContent" rows="1" class="auto-grow"></textarea>
        </div>

        <div id="field-bedtime" hidden>
          <label>就寝時刻</label>
          <div class="field-row">
            <input type="text" id="editBedtime" data-allow-24 autocomplete="off" />
            <button type="button" class="now-btn" data-target="editBedtime"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></button>
          </div>
          <label>起床時刻</label>
          <div class="field-row">
            <input type="time" id="editWake" step="300" />
            <button type="button" class="now-btn" data-target="editWake"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3.5 2"></path></svg></button>
          </div>
        </div>

        <div id="field-level" hidden>
          <label>調子（もう一度タップで解除）</label>
          <div class="chip-row" id="editLevelChips">
            <div class="chip" data-value="絶好調">絶好調</div>
            <div class="chip" data-value="良い">良い</div>
            <div class="chip" data-value="普通">普通</div>
            <div class="chip" data-value="悪い">悪い</div>
            <div class="chip" data-value="最悪">最悪</div>
          </div>
          <label>排便</label>
          <div class="chip-row" id="editStoolChips" style="grid-template-columns: repeat(4, 1fr);">
            <div class="chip" data-value="水っぽい">水っぽい</div>
            <div class="chip" data-value="柔らかめ">柔らかめ</div>
            <div class="chip" data-value="普通">普通</div>
            <div class="chip" data-value="硬め">硬め</div>
          </div>
          <label>内容</label>
          <input type="text" id="editNote" />
        </div>

        <div id="field-items" hidden>
          <label>品目（1行に1品目）</label>
          <textarea id="editItems" rows="1" class="auto-grow"></textarea>
        </div>
      </form>

      <div class="modal-status" id="modalStatus"></div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" id="cancelEditBtn">キャンセル</button>
        <button type="button" class="save-btn" id="saveEditBtn">保存</button>
      </div>
    </div>
  </div>

<script src="growth.js"></script>
<script src="body.js"></script>
<script src="history.js"></script>
<script src="weather.js"></script>
<script src="pull-refresh.js"></script>
</body>
</html>
