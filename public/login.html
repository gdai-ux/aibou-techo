<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<script>
try {
  if (localStorage.getItem('themeSetting') === 'light') document.documentElement.classList.add('theme-light');
} catch (e) { /* 既定のブラックのまま */ }
</script>
<title>あいぼう手帳 ログイン</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="stylesheet" href="history.css" />
<script src="notion-client.js"></script>
<script src="vendor/supabase.js"></script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e0e11;
    --card: #17171b;
    --fill: rgba(255, 255, 255, 0.07);
    --text: #f2f2f7;
    --muted: #8e8e96;
    --accent: #cf9d43;
    --accent-text: #17150f;
    --border: rgba(255, 255, 255, 0.06);
    --border-strong: rgba(255, 255, 255, 0.1);
    --ok: #34c759;
    --err: #ff453a;
    --shadow: 0 0 0 0 transparent;
    --edge: 0 0 0 0 transparent;
    --ease: cubic-bezier(.32, .72, 0, 1);
  }
  :root.theme-light {
    --bg: #f2f2f7;
    --card: #ffffff;
    --fill: rgba(120, 120, 128, 0.12);
    --text: #1c1c1e;
    --muted: #6e6e73;
    --accent: #96702a; --accent-text: #ffffff;
    --border: rgba(0, 0, 0, 0.06);
    --border-strong: rgba(0, 0, 0, 0.1);
    --err: #ff3b30;
    --shadow: 0 0 0 0 transparent;
    --edge: 0 0 0 0 transparent;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--bg); }
  body {
    margin: 0 auto;
    max-width: 480px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: calc(24px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
  }
  .brand { text-align: center; margin-bottom: 22px; }
  .brand img { width: 72px; height: 72px; image-rendering: pixelated; }
  .brand h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin: 10px 0 4px; }
  .brand p { margin: 0; font-size: 13px; color: var(--muted); }
  .card {
    background: var(--card);
    border: none;
    border-radius: 16px;
    padding: 20px 18px;
  }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  input[type="email"] {
    width: 100%;
    font: inherit;
    font-size: 16px;
    color: var(--text);
    background: var(--fill);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    outline: none;
  }
  input[type="email"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--accent-text);
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform .1s var(--ease), opacity .15s ease;
  }
  button:active { transform: scale(0.98); }
  button:disabled { opacity: 0.5; cursor: default; }
  .msg { margin: 12px 0 0; font-size: 13px; line-height: 1.6; color: var(--muted); min-height: 1.6em; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--err); }
  /* メールに書かれたコード。桁数は決め打ちにしない（Supabaseの設定しだいで
     6桁にも8桁にもなり、6桁までしか入らない欄にしたら8桁が届いて詰まった）。
     ホーム画面に追加したアプリの中では、
     メールのリンクを押しても別のブラウザが開いてしまい、アプリには戻って
     こられない。コードなら、いま開いている画面のまま入れる */
  .code-box { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--border); }
  .code-box[hidden] { display: none; }
  input[type="text"].code-input {
    width: 100%;
    font: inherit;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    text-align: center;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    background: var(--fill);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 14px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"].code-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
  .note { margin: 18px 0 0; font-size: 12px; color: var(--muted); line-height: 1.7; text-align: center; }
  .note a { color: var(--accent); text-decoration: none; }
</style>
</head>
<body>
  <div class="brand">
    <img src="icon.svg" alt="" />
    <h1>あいぼう手帳</h1>
    <p>話すだけで記録が残り、相棒が育つ健康記録</p>
  </div>

  <div class="card">
    <form id="loginForm">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" inputmode="email" autocomplete="email" placeholder="you@example.com" required />
      <button type="submit" id="sendBtn">ログイン用のリンクを送る</button>
      <p class="msg" id="msg">パスワードは不要です。届いたメールのリンクを開くか、書かれているコードを入れるとログインできます。</p>
    </form>
    <div class="code-box" id="codeBox" hidden>
      <label for="code">メールに書かれたコード</label>
      <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="12345678" class="code-input" />
      <button type="button" id="codeBtn">このコードで入る</button>
      <p class="msg" id="codeMsg">リンクが別のブラウザで開いてしまう時は、こちらを使ってください。</p>
    </div>
  </div>
  <p class="note">登録すると、<a href="terms.html">利用規約</a>・<a href="privacy.html">プライバシーポリシー</a>に同意したものとみなします。</p>

  <p class="note">初めての方も、同じ手順でそのまま始められます。<br>登録したメールアドレスは、ログインとご案内以外には使いません。</p>

  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const sendBtn = document.getElementById('sendBtn');
    const codeBox = document.getElementById('codeBox');
    const codeInput = document.getElementById('code');
    const codeBtn = document.getElementById('codeBtn');
    const codeMsg = document.getElementById('codeMsg');
    const params = new URLSearchParams(location.search);
    const next = (params.get('next') || 'index.html').replace(/[^a-zA-Z0-9_.\-]/g, '') || 'index.html';

    // マジックリンクから戻ってきた時の情報は、クエリ（?…）とハッシュ（#…）の
    // どちらに入ってくることもある（成功時はハッシュ、エラー時は両方）ので両方見る
    function authParam(name) {
      const q = new URLSearchParams(location.search);
      const h = new URLSearchParams(location.hash.replace(/^#/, ''));
      return q.get(name) || h.get(name);
    }
    // 読み取ったあとはURLから消す。そのままだと再読み込みで同じエラーがまた出るため
    function clearAuthParamsFromUrl() {
      history.replaceState(null, '', `${location.pathname}?next=${encodeURIComponent(next)}`);
    }
    // Supabaseがリンクを弾いた時の理由。メールのリンクは一度開くと無効になるので、
    // 「もう一度送れば直る」ことを必ず添える
    const LINK_ERRORS = {
      otp_expired: 'ログイン用のリンクの期限が切れていました。リンクは1回きりで、時間が経つと使えなくなります。お手数ですが、下からもう一度送ってください。',
      access_denied: 'ログイン用のリンクが使えませんでした（すでに一度開かれたか、期限が切れています）。下からもう一度送ってください。',
    };

    let client = null;
    async function setup() {
      // マジックリンクから戻ってきたかどうかは、supabase-jsがURLを片付ける前に見ておく
      const cameFromLink = !!(authParam('access_token') || authParam('code'));
      const linkError = authParam('error_code') || authParam('error');
      if (linkError) {
        // 以前はここで何も出さずログイン画面に戻していたため、
        // 「リンクを押しても何も起きない」ように見えていた
        msg.className = 'msg err';
        msg.textContent = LINK_ERRORS[linkError] || 'ログインできませんでした。下からもう一度リンクを送ってください。';
        clearAuthParamsFromUrl();
      }
      try {
        const resp = await fetch('/api/status');
        const status = await resp.json();
        if (!status.authRequired) { location.replace(next); return; }
        if (status.loggedIn) { location.replace(next); return; }
        if (!status.supabaseUrl || !status.supabaseAnonKey) {
          msg.className = 'msg err';
          msg.textContent = 'ログインの設定がまだ済んでいません（サーバーの SUPABASE_URL / SUPABASE_ANON_KEY）。';
          sendBtn.disabled = true;
          return;
        }
        client = supabase.createClient(status.supabaseUrl, status.supabaseAnonKey, SUPABASE_AUTH_OPTIONS);
        // マジックリンクから戻ってきた時は、URLに載っているトークンを supabase-js が
        // セッションに変える（detectSessionInUrl）。createClientのあとに非同期で
        // 走るので、getSession()で終わるのを待ってから判断する
        if (cameFromLink && !linkError) {
          const { data } = await client.auth.getSession();
          if (data && data.session) { location.replace(next); return; }
          msg.className = 'msg err';
          msg.textContent = 'リンクの確認に失敗しました。下からもう一度送ってください。';
          clearAuthParamsFromUrl();
        }
      } catch (e) {
        msg.className = 'msg err';
        msg.textContent = 'サーバーに接続できません。しばらくしてからもう一度お試しください。';
      }
    }
    setup();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!client) return;
      const email = document.getElementById('email').value.trim();
      sendBtn.disabled = true;
      msg.className = 'msg';
      msg.textContent = '送信しています…';
      const redirectTo = `${location.origin}${location.pathname}?next=${encodeURIComponent(next)}`;
      const { error } = await client.auth.signInWithOtp({ email, options: { emailRedirectTo: redirectTo } });
      if (error) {
        sendBtn.disabled = false;
        msg.className = 'msg err';
        msg.textContent = /rate/i.test(error.message) ? '送信が続きすぎています。少し待ってからもう一度お試しください。' : 'メールを送れませんでした。アドレスを確認してもう一度お試しください。';
        return;
      }
      msg.className = 'msg ok';
      msg.textContent = `${email} に送りました（届くまで1〜2分かかることがあります）。メールのリンクを押すか、下にコードを入れてください。`;
      codeBox.hidden = false;
      sendBtn.textContent = 'もう一度送る';
      sendBtn.disabled = false;
    });

    // コードで入る。ホーム画面に追加したアプリの中でメールのリンクを押すと、
    // 既定のブラウザ（Chromeなど）が開いてしまい、アプリ側はログインできない。
    // しかもリンクは1回きりなので、あとからSafariで開いても「期限切れ」になる。
    // コードなら、いま開いているこの画面のまま最後まで進められる
    codeBtn.addEventListener('click', async () => {
      if (!client) return;
      const email = document.getElementById('email').value.trim();
      const token = codeInput.value.replace(/[^0-9]/g, '');
      // 桁数はメールに書かれているものをそのまま受ける（決め打ちにしない）
      if (!email || token.length < 6) {
        codeMsg.className = 'msg err';
        codeMsg.textContent = 'メールアドレスと、メールに書かれたコードを入れてください。';
        return;
      }
      codeBtn.disabled = true;
      codeMsg.className = 'msg';
      codeMsg.textContent = '確認しています…';
      const { data, error } = await client.auth.verifyOtp({ email, token, type: 'email' });
      if (error || !data || !data.session) {
        codeBtn.disabled = false;
        codeMsg.className = 'msg err';
        codeMsg.textContent = /expired/i.test(error && error.message || '')
          ? 'コードの期限が切れています。上からもう一度送ってください。'
          : 'コードが合いませんでした。メールに書かれた数字をもう一度ご確認ください。';
        return;
      }
      location.replace(next);
    });
  </script>
</body>
</html>
